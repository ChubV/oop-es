[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "oop-es-example"
dynamic = ["version"]
description = "OOP Event Sourcing example"
readme = "README.md"
authors = [{name = "Volodymyr Chub"}]
license = { text = "MIT" }

dependencies=["oop-es", "oop-di"]

[project.urls]
Homepage = "https://github.com/ChubV/oop-es/"
Repository = "https://github.com/ChubV/oop-es/"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "ty", "ruff"]

[tool.ruff]
line-length = 80
select = ["E", "F", "B", "A"]
ignore = ["E203", "E501", "W503"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
root = "../"